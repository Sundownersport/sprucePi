name: Build image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Export only the spruce stage
        run: touch stage2/SKIP_IMAGES
      - name: Build
        run: ./build-docker.sh -c sprucepi.config
      - uses: actions/upload-artifact@v4
        with:
          name: sprucePi
          path: deploy/*.img.xz
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: deploy/*.log
